<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Blade Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { margin: 0; background-color: #0b0f19; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="relative w-screen h-screen">

  <canvas id="gameCanvas"></canvas>

  <!-- Top Bar UI -->
  <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
    <div class="glass px-4 py-2 rounded-2xl flex items-center gap-4 text-white shadow-lg pointer-events-auto">
      <div>
        <p class="text-xs uppercase tracking-wider text-slate-400 font-bold">Score</p>
        <p id="scoreVal" class="text-2xl font-black text-amber-400">0</p>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div>
        <p class="text-xs uppercase tracking-wider text-slate-400 font-bold">Time</p>
        <p id="timerVal" class="text-2xl font-black text-emerald-400">60s</p>
      </div>
    </div>

    <div class="glass px-3 py-2 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-lg">
      <button id="soundBtn" class="text-white hover:text-amber-400 p-2 text-lg">🔊</button>
      <button id="pauseBtn" class="text-white hover:text-amber-400 p-2 text-lg font-bold">⏸</button>
    </div>
  </div>

  <!-- Start / Instructions Overlay -->
  <div id="startOverlay" class="absolute inset-0 z-20 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="glass p-6 md:p-8 rounded-3xl max-w-sm w-full text-center text-white border border-slate-700/60 shadow-2xl">
      <div class="text-5xl mb-3">🍉 ⚔️</div>
      <h1 class="text-2xl font-black tracking-tight mb-2 bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">FRUIT BLADE</h1>
      <p class="text-sm text-slate-300 mb-4 leading-relaxed">Swipe or drag across screen to slice flying fruits. Cut multiple fruits together for combos! Avoid glowing bombs.</p>
      <div class="bg-slate-900/80 rounded-xl p-3 mb-5 text-xs text-slate-400 flex justify-around">
        <span>🍉 Slice: +10</span>
        <span>💣 Bomb: Boom!</span>
        <span>⏱️ Time: 60s</span>
      </div>
      <button id="startBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-400 hover:to-rose-400 font-extrabold rounded-2xl text-base tracking-wide shadow-lg shadow-rose-950/40 active:scale-95 transition">PLAY NOW</button>
    </div>
  </div>

  <!-- Game Over / Pause Overlay -->
  <div id="msgOverlay" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden">
    <div class="glass p-6 md:p-8 rounded-3xl max-w-sm w-full text-center text-white border border-slate-700/60 shadow-2xl">
      <div id="msgIcon" class="text-5xl mb-2">💥</div>
      <h2 id="msgTitle" class="text-2xl font-black mb-1">GAME OVER</h2>
      <p id="msgDesc" class="text-sm text-slate-400 mb-4">You sliced a bomb!</p>
      <div class="bg-slate-900/80 rounded-2xl p-4 mb-5 flex justify-around">
        <div>
          <p class="text-xs text-slate-400 uppercase font-bold">Final Score</p>
          <p id="finalScore" class="text-2xl font-black text-amber-400">0</p>
        </div>
        <div class="h-10 w-px bg-slate-700"></div>
        <div>
          <p class="text-xs text-slate-400 uppercase font-bold">Best Score</p>
          <p id="highScore" class="text-2xl font-black text-emerald-400">0</p>
        </div>
      </div>
      <button id="restartBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-rose-500 font-extrabold rounded-2xl text-base tracking-wide shadow-lg active:scale-95 transition">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Sound FX with Web Audio
    let audioCtx = null;
    let soundEnabled = true;
    function playTone(freq, type, duration) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const FRUIT_TYPES = [
      { name: 'Watermelon', radius: 42, color: '#10b981', flesh: '#f43f5e', points: 10 },
      { name: 'Orange', radius: 36, color: '#f97316', flesh: '#fb923c', points: 12 },
      { name: 'Lemon', radius: 32, color: '#eab308', flesh: '#fde047', points: 15 },
      { name: 'Plum', radius: 30, color: '#8b5cf6', flesh: '#a855f7', points: 15 }
    ];

    let gameState = 'ready';
    let score = 0, highScoreVal = parseInt(localStorage.getItem('fb_hi') || '0');
    let timeLeft = 60, timerId = null;
    let spawnTimer = 0;
    let items = [], particles = [], trail = [];
    let isSwiping = false;

    class Item {
      constructor() {
        this.isBomb = Math.random() < 0.22;
        this.type = this.isBomb ? null : FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
        this.radius = this.isBomb ? 34 : this.type.radius;
        this.x = W * 0.15 + Math.random() * (W * 0.7);
        this.y = H + this.radius;
        this.vx = (W / 2 - this.x) * (0.008 + Math.random() * 0.006);
        this.vy = -(H * (0.016 + Math.random() * 0.006));
        this.gravity = H * 0.00032;
        this.rot = 0;
        this.vRot = (Math.random() - 0.5) * 0.08;
        this.sliced = false;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rot += this.vRot;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        if (this.isBomb) {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#1e293b';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#ef4444';
          ctx.stroke();
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(this.radius * 0.5, -this.radius * 0.5, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.type.color;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = this.type.flesh;
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.life = 1;
        this.decay = 0.03 + Math.random() * 0.03;
        this.size = 3 + Math.random() * 5;
      }
      update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function checkSlice(p1, p2) {
      for (let item of items) {
        if (item.sliced) continue;
        const dist = Math.hypot(item.x - p2.x, item.y - p2.y);
        if (dist < item.radius + 15) {
          item.sliced = true;
          if (item.isBomb) {
            playTone(120, 'sawtooth', 0.5);
            for (let i = 0; i < 30; i++) particles.push(new Particle(item.x, item.y, '#ef4444'));
            gameOver(true);
            return;
          } else {
            playTone(400 + Math.random() * 300, 'sine', 0.12);
            score += item.type.points;
            document.getElementById('scoreVal').innerText = score;
            for (let i = 0; i < 18; i++) particles.push(new Particle(item.x, item.y, item.type.flesh));
          }
        }
      }
    }

    function startGame() {
      gameState = 'playing';
      score = 0;
      timeLeft = 60;
      items = [];
      particles = [];
      trail = [];
      document.getElementById('scoreVal').innerText = '0';
      document.getElementById('timerVal').innerText = '60s';
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('msgOverlay').classList.add('hidden');
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (gameState !== 'playing') return;
        timeLeft--;
        document.getElementById('timerVal').innerText = timeLeft + 's';
        if (timeLeft <= 0) gameOver(false);
      }, 1000);
    }

    function gameOver(hitBomb) {
      gameState = 'over';
      clearInterval(timerId);
      if (score > highScoreVal) {
        highScoreVal = score;
        localStorage.setItem('fb_hi', highScoreVal);
      }
      document.getElementById('msgIcon').innerText = hitBomb ? '💥' : '⏰';
      document.getElementById('msgTitle').innerText = hitBomb ? 'BOOM!' : 'TIME UP!';
      document.getElementById('msgDesc').innerText = hitBomb ? 'You sliced a bomb!' : 'Great job slicing fruits!';
      document.getElementById('finalScore').innerText = score;
      document.getElementById('highScore').innerText = highScoreVal;
      document.getElementById('msgOverlay').classList.remove('hidden');
    }

    function addTrailPoint(x, y) {
      trail.push({ x, y, life: 1 });
      if (trail.length > 1) checkSlice(trail[trail.length - 2], trail[trail.length - 1]);
    }

    window.addEventListener('pointerdown', (e) => { isSwiping = true; trail = []; addTrailPoint(e.clientX, e.clientY); });
    window.addEventListener('pointermove', (e) => { if (isSwiping) addTrailPoint(e.clientX, e.clientY); });
    window.addEventListener('pointerup', () => { isSwiping = false; });

    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = startGame;
    document.getElementById('soundBtn').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
    };
    document.getElementById('pauseBtn').onclick = () => {
      if (gameState === 'playing') {
        gameState = 'paused';
        document.getElementById('pauseBtn').innerText = '▶️';
      } else if (gameState === 'paused') {
        gameState = 'playing';
        document.getElementById('pauseBtn').innerText = '⏸';
      }
    };

    function loop() {
      ctx.clearRect(0, 0, W, H);
      if (gameState === 'playing') {
        spawnTimer++;
        if (spawnTimer % 45 === 0) items.push(new Item());
      }
      for (let i = items.length - 1; i >= 0; i--) {
        items[i].update();
        items[i].draw();
        if (items[i].y > H + 100 || items[i].sliced) items.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      if (trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life -= 0.15;
        if (trail[i].life <= 0) trail.splice(i, 1);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
