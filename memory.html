<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory Match - Mini Game Arcade</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body { margin: 0; background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 12px 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 360px; margin-top: 20px; }
    .card { aspect-ratio: 1; background: #1e293b; border: 2px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
    .card.flipped { background: #3b82f6; border-color: #60a5fa; }
    .card.matched { background: #10b981; border-color: #34d399; pointer-events: none; }
    .btn { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none; font-weight: 800; border-radius: 12px; cursor: pointer; padding: 10px 20px; font-size: 14px; margin-top: 20px; }
    .nav { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div class="nav">
    <a href="index.html" style="color: #fbbf24; text-decoration: none; font-weight: bold; font-size: 14px;">← Back to Arcade</a>
    <div class="glass" style="padding: 6px 14px; font-size: 13px;">Moves: <span id="moves" style="color: #fbbf24; font-weight: bold;">0</span></div>
  </div>

  <h1 style="font-size: 20px; margin: 16px 0 4px 0; font-weight: 900; color: #60a5fa;">MEMORY MATCH</h1>
  <p style="font-size: 12px; color: #94a3b8; margin: 0;">Find all matching emoji pairs</p>

  <div class="grid" id="grid"></div>

  <button class="btn" onclick="initGame()">RESTART GAME</button>

  <script>
    const emojis = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍍', '🥝'];
    let cards = [...emojis, ...emojis];
    let flippedCards = [];
    let matchedCount = 0;
    let moves = 0;
    let lock = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function initGame() {
      shuffle(cards);
      flippedCards = [];
      matchedCount = 0;
      moves = 0;
      lock = false;
      document.getElementById('moves').innerText = '0';
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      card.innerText = card.dataset.emoji;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves').innerText = moves;
        lock = true;
        if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {
          flippedCards[0].classList.add('matched');
          flippedCards[1].classList.add('matched');
          flippedCards = [];
          lock = false;
          matchedCount += 2;
          if (matchedCount === cards.length) {
            setTimeout(() => alert('🎉 Completed in ' + moves + ' moves!'), 300);
          }
        } else {
          setTimeout(() => {
            flippedCards[0].classList.remove('flipped');
            flippedCards[0].innerText = '';
            flippedCards[1].classList.remove('flipped');
            flippedCards[1].innerText = '';
            flippedCards = [];
            lock = false;
          }, 800);
        }
      }
    }

    initGame();
  </script>
</body>
</html>
